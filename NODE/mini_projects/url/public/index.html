<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>URL Shortener</h1>
      <form id="shorten-form">
        <div>
          <label for="url">Enter URL:</label>
          <input
            type="url"
            id="url"
            name="url"
            placeholder="https://example.com"
            required
          />
        </div>
        <div>
          <label for="shortCode">Enter shortCode:</label>
          <input type="text" id="shortCode" name="shortCode" />
        </div>
        <button type="submit">Shorten</button>
      </form>

      <h2>Shorten URLs</h2>
      <ul id="shortened-urls"></ul>
    </div>

    <script>
        const fetchShortenedUrls = async () =>{
            const respone = await fetch("/links");
            const links = await respone.json();
            console.log(links);

            const list  = document.getElementById('shortened-urls');
            list.innerHTML = ''; // Clear the list before adding new items

            for (const [shortCode, url] of Object.entries(links)) {
                const listItem = document.createElement('li');
                const truncatedUrl = url.length > 30 ? url.slice(0, 30) + '...' : url; // Truncate URL if it's too long
                listItem.innerHTML = `<a href="${shortCode}" target="_blank">${window.location.origin}/${shortCode}</a> -${truncatedUrl}`;
                list.appendChild(listItem);
            }
        }
      
      document.getElementById('shorten-form')
      .addEventListener('submit', async (event) =>{
          event.preventDefault();

          const formData = new FormData(event.target);
          const url = formData.get('url');
          const shortCode = formData.get('shortCode');

          console.log(url, shortCode);

          try{
              const response = await fetch("/shorten",{
                  method : "POST",
                  headers : {
                      "Content-Type": "application/json"
                  },
                  body : JSON.stringify({ url, shortCode })
              });
              if(response.ok){
                fetchShortenedUrls();
                alert("Form submitted successfully!");
                event.target.reset(); // Reset the form after submission
               }
                else{
                    const errorMessage = await response.text();
                    alert("Error: " + errorMessage);
                }
          }
          catch(error){
              console.error("Error shortening URL:", error);
          }
      });
      fetchShortenedUrls();
    </script>
  </body>
</html>
