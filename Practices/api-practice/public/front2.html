<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cursor pagination</title>
  </head>
  <body>
    <h1>These are the campaigns</h1>
    <ul id="container"></ul>
    <button id="load">Load more</button>
  </body>
  <script>
    const load = document.getElementById("load");
    const container = document.getElementById("container");
    let Cursor = 0;
    let Limit = 10;

    async function fetchCampaigns(cursor, limit) {
      try {
        const response = await fetch(`http://localhost:3020/campaigns?cursor=${cursor}&limit=${limit}`);
        const campaign = await response.json();

        if (campaign.length === 0) {
          load.disabled = true;
          load.textContent = "No more campaigns";
          return;
        }

        campaign.forEach((camp) => {
          const li = document.createElement("li");
          li.textContent = `id: ${camp.id} | name: ${camp.name}, email: ${camp.email}`;
          container.appendChild(li);
        });

        Cursor = Cursor + campaign.length;
      } catch (error) {
        console.log("An Error has occured", error);
      }
    }

    fetchCampaigns(Cursor, Limit);

    load.addEventListener("click", () => {
      console.log("Hi clicking the button");
      fetchCampaigns(Cursor, Limit);
    });
  </script>
</html>
